<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57068c"/>
      <stop offset="100%" stop-color="#3f0468"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57068c" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#57068c" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57068c"/>
      <stop offset="100%" stop-color="#3f0468"/>
    </linearGradient>
  </defs>

  <!-- Icon: Stylized chart with dynamic curve -->
  <g transform="translate(12, 12)">
    <!-- Background rounded square -->
    <rect x="0" y="0" width="116" height="116" rx="26" fill="#f4eff9" stroke="#d8c6e7" stroke-width="1.5"/>

    <!-- Grid lines (subtle) -->
    <line x1="24" y1="32" x2="24" y2="92" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,3"/>
    <line x1="46" y1="32" x2="46" y2="92" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,3"/>
    <line x1="68" y1="32" x2="68" y2="92" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,3"/>
    <line x1="90" y1="32" x2="90" y2="92" stroke="#cbd5e1" stroke-width="0.75" stroke-dasharray="2,3"/>

    <!-- Area fill under the curve -->
    <path d="M24,78 C35,72 42,44 52,40 C62,36 72,56 80,48 C88,40 90,34 96,30 L96,92 L24,92 Z" fill="url(#curveGrad)"/>

    <!-- Dynamic pricing curve -->
    <path d="M24,78 C35,72 42,44 52,40 C62,36 72,56 80,48 C88,40 90,34 96,30" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Price point dot with pulse ring -->
    <circle cx="80" cy="48" r="8" fill="#57068c" fill-opacity="0.12"/>
    <circle cx="80" cy="48" r="4.5" fill="#fff" stroke="#57068c" stroke-width="2.5"/>

    <!-- Small bar chart elements at bottom -->
    <rect x="28" y="76" width="8" height="16" rx="2" fill="url(#barGrad)" opacity="0.35"/>
    <rect x="40" y="68" width="8" height="24" rx="2" fill="url(#barGrad)" opacity="0.5"/>
    <rect x="52" y="60" width="8" height="32" rx="2" fill="url(#barGrad)" opacity="0.65"/>
    <rect x="64" y="64" width="8" height="28" rx="2" fill="url(#barGrad)" opacity="0.55"/>
    <rect x="76" y="56" width="8" height="36" rx="2" fill="url(#barGrad)" opacity="0.8"/>
    <rect x="88" y="52" width="8" height="40" rx="2" fill="url(#barGrad)" opacity="1"/>

    <!-- Dollar sign accent -->
    <text x="16" y="28" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#57068c" opacity="0.5">$</text>
  </g>

  <!-- Text: Application Name -->
  <g transform="translate(148, 0)">
    <!-- Main title -->
    <text y="58" font-family="'DM Sans', system-ui, sans-serif" font-size="36" font-weight="800" fill="#0f172a" letter-spacing="-0.5">
      Dynamic Pricing
    </text>
    <!-- Subtitle -->
    <text y="90" font-family="'DM Sans', system-ui, sans-serif" font-size="28" font-weight="500" fill="#64748b" letter-spacing="0">
      Sandbox
    </text>
    <!-- Tagline -->
    <text y="118" font-family="'DM Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="2.5" text-transform="uppercase">
      INTERACTIVE PRICING SIMULATION
    </text>
  </g>
</svg>
